name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install pinned deps
        run: pip install -r requirements.lock
      - name: Lint
        run: python tasks.py lint
      - name: Unit + property tests
        run: python tasks.py test
