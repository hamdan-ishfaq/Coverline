repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.8
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format
  - repo: local
    hooks:
      - id: check-secrets
        name: check-secrets
        entry: python scripts/check_secrets.py
        language: system
        pass_filenames: false